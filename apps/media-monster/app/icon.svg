<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Media Monster">
  <title>Media Monster</title>
  <!-- Feet first: the body overlaps them, which is what makes the creature
       sit ON something rather than float above it. -->
  <rect x="15.65" y="80.1" width="33.35" height="17.55" rx="8.78" fill="#ffccad" />
  <rect x="51" y="80.1" width="33.35" height="17.55" rx="8.78" fill="#ffccad" />
  <!-- The body. A PLAIN CIRCLE — see the note above CX. -->
  <circle cx="50" cy="45" r="43" fill="#b0e562" />
  <circle cx="50" cy="45" r="28.08" fill="#f6f2e3" />
  <circle cx="50" cy="45" r="17.11" fill="#1d2a1d" />
  <!-- The glint. Upper-left, because that is where the source puts it and it
       is what stops the eye reading as a hole. -->
  <circle cx="43.5" cy="37.81" r="5.13" fill="#f6f2e3" />
</svg>
