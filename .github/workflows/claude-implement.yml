name: Claude — implement issue

# Claude's half of the two-agent loop: it implements ONE trusted issue and
# opens a pull request, then addresses review feedback on that PR.
#
# Triggers (all owner-gated — a bot cannot start this, per the "no bot triggers
# a bot automatically" rule; you introduce work by labeling or mentioning):
#   * an issue gets the `claude` label
#   * you comment `@claude` on an issue
#   * a review requests changes on a Claude-authored PR (feedback loop)
#
# The PR is opened with LOOP_PAT, NOT github.token, on purpose: a PR created by
# github.token does not trigger `pull_request` workflows, so the CI gate and
# merge guard would never report and auto-merge would hang forever. LOOP_PAT
# creates a real PR that fires those checks.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  implement:
    name: Implement / address feedback
    # Owner-authored triggers only. The three shapes: labeled `claude`,
    # `@claude` comment on an issue (not a PR), or a changes-requested review
    # on a PR. github.repository_owner is the single source of "is this me".
    if: >-
      github.actor == github.repository_owner &&
      (
        (github.event_name == 'issues' && github.event.label.name == 'claude') ||
        (github.event_name == 'issue_comment' &&
         contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' &&
         github.event.review.state == 'changes_requested')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # LOOP_PAT (a PAT), NOT github.token: a fix commit pushed with
          # github.token does not trigger `pull_request` workflows, so CI never
          # runs on the fix and the required check stays absent — the PR blocks
          # forever. Pushing as the PAT fires `synchronize` and CI runs.
          github_token: ${{ secrets.LOOP_PAT }}
          branch_name_template: "claude/issue-{{entityNumber}}-{{timestamp}}"
          use_commit_signing: true
          additional_permissions: |
            actions: read
          # Opus for gated work (the default lane, plus every auto-fix and
          # review-feedback run — those only ever happen on gated PRs); Sonnet
          # for the `chore` skip lane, where the change is trivial by definition.
          # A chore is identifiable only on the issue-labeled trigger; the PR
          # (@claude) and review triggers are always gated, so they fall to Opus.
          claude_args: |
            --model ${{ (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'chore')) && 'claude-sonnet-5' || 'claude-opus-4-8' }}
            --max-turns 80
            --system-prompt "You are the implementation agent for one trusted GitHub issue (or one round of review feedback on your own PR). Follow AGENTS.md and every nested instruction file. Make the smallest complete change, add focused regression coverage, and run the closest relevant validation before finishing. On a changes-requested review, address exactly the reviewer's points on the same branch. Never broaden scope, never file new issues, never merge, and never edit .github/workflows unless the issue explicitly asks for it."

      # Only issue-origin runs open a PR; a PR-comment (@claude) or review-
      # feedback run pushes to the existing branch, then re-arms the gate below.
      #
      # Codex-gated by DEFAULT; the SOURCE ISSUE's `chore` label opts out:
      #   * default (bug/feature/anything non-chore) — DON'T arm auto-merge;
      #     label the PR `gated`, which fires codex-gate.yml. That gate waits
      #     for Codex's verdict and arms auto-merge only on approval, so nothing
      #     merges out from under Codex's review.
      #   * chore (`chore` label) — the skip lane: arm auto-merge here so a
      #     trivial change lands on green CI without waiting on Codex. Use it
      #     discriminately.
      # `hold` still vetoes either lane.
      - name: Open pull request
        if: >-
          (github.event_name == 'issues' ||
           (github.event_name == 'issue_comment' && github.event.issue.pull_request == null)) &&
          steps.claude.outputs.branch_name != ''
        env:
          GH_TOKEN: ${{ secrets.LOOP_PAT }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          BASE: ${{ github.event.repository.default_branch }}
          ISSUE: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          IS_CHORE: ${{ contains(github.event.issue.labels.*.name, 'chore') }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"

          existing="$(gh pr list --repo "$repo" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "PR #$existing already open for $BRANCH."
            pr="$existing"
          else
            if [ "$IS_CHORE" = "true" ]; then
              body="$(printf 'Implemented by Claude from #%s. Closes #%s.\n\n**Chore — skip lane.** Auto-merge is armed: this lands on its own once CI is green and the merge guard passes (no Codex gate). Add the `hold` label to veto.' "$ISSUE" "$ISSUE")"
            else
              body="$(printf 'Implemented by Claude from #%s. Closes #%s.\n\n**Codex-gated.** Auto-merge is NOT armed yet. The Codex gate waits for a review, then arms auto-merge only if Codex approves (👍). If Codex flags findings or is silent past the window, this stays open for you. Add the `hold` label to force manual merge.' "$ISSUE" "$ISSUE")"
            fi
            pr="$(gh pr create --repo "$repo" --base "$BASE" --head "$BRANCH" \
              --title "$TITLE" --body "$body" | grep -oE '[0-9]+$')"
          fi

          if [ "$IS_CHORE" = "true" ]; then
            gh issue comment "$ISSUE" --repo "$repo" --body "Opened PR #${pr} — chore, auto-merge armed, Codex gate skipped (add \`hold\` to veto)."
            gh pr merge "$pr" --repo "$repo" --auto --merge || \
              echo "::warning::Could not arm auto-merge (enable it in repo settings and add required checks)."
          else
            # Hand off to the Codex gate. Adding the label via LOOP_PAT (not
            # github.token) is what lets codex-gate.yml's pull_request trigger fire.
            gh pr edit "$pr" --repo "$repo" --add-label gated
            gh issue comment "$ISSUE" --repo "$repo" --body "Opened PR #${pr} — Codex-gated (auto-merge armed only if Codex approves)."
          fi

      # A PR-comment (@claude, e.g. the Codex gate's auto-fix request) or a
      # changes-requested review means Claude just pushed a fix to an EXISTING
      # gated PR. Two things must happen for the loop to continue:
      #   1. Explicitly ask Codex to re-review — its auto-review fires on OWNER
      #      pushes but NOT on this bot's fix push, so relying on "on every push"
      #      stalls the loop. `@codex review` forces it.
      #   2. Re-fire the gate (toggle `gated`) so it polls for the new verdict.
      # Only gated PRs loop; chore/manual PRs are left alone.
      - name: Re-request Codex review and re-arm the gate after a fix
        if: >-
          (github.event_name == 'issue_comment' && github.event.issue.pull_request != null) ||
          github.event_name == 'pull_request_review'
        env:
          GH_TOKEN: ${{ secrets.LOOP_PAT }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          if gh pr view "$PR" --repo "$repo" --json labels --jq '.labels[].name' | grep -qx gated; then
            gh pr comment "$PR" --repo "$repo" --body "@codex review"
            gh pr edit "$PR" --repo "$repo" --remove-label gated || true
            sleep 2
            gh pr edit "$PR" --repo "$repo" --add-label gated
          fi
