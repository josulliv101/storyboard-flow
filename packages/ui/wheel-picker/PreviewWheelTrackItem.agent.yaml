component: PreviewWheelTrackItem

category: editor

purpose: >
  A component that wraps individual items in the preview wheel tracks. It calculates 3D transform metrics (translation, rotation, scale, depth) based on the active layout effect, and renders the top TimelineRuler and the child PreviewWheelMediaTile.

inputs:
  - item: SceneLaunchMediaItem (the media item data)
  - index: number (the item's index in the track list)
  - sizing: SceneLaunchPreviewWheelV3Sizing (uniform vs duration sizing)
  - effect: SceneLaunchPreviewWheelV3Effect (cylinder, coverflow, gallery, stack)
  - isPreviewPlaying: boolean (global preview playback status)
  - scrubSnapshot: GalleryScrubSnapshot | null (current timeline scrub details)

outputs: []

dependencies:
  - React
  - TimelineRuler
  - PreviewWheelMediaTile

always:
  - Keep 3D transformation offsets and matrix calculations aligned with the active layout effect.
  - Forward click gestures, resizes, and transitions to the respective hooks and parent callbacks.

never:
  - Directly mutate global timeline offsets or refs outside of parent callback functions.
