component: PreviewWheelMediaTile

category: editor

purpose: >
  Renders a single media item card (video/image) inside the timeline track or grid. Displays card effects (angles, transformations, grayscale, borders), multi-circle nested collection representations, and visual trim handles for resizing.

inputs:
  - item: SceneLaunchMediaItem (target media data)
  - index: number (index position)
  - thumbnailItem: SceneLaunchMediaItem
  - itemWidth: number
  - itemHeight: number
  - itemCenterY: number
  - itemGap: number
  - isActive: boolean (active selection status)
  - isCentered: boolean (centered focus flag)
  - isSnapping: boolean (wheel snaps transition lock)
  - isWheelMoving: boolean
  - disabled: boolean (grayscale disabled lock)
  - isCollection: boolean (folder format indicator)
  - collectionMultiCircleEnabled: boolean (nested concentric circles style)
  - collectionMediaItems: SceneLaunchMediaItem[] (children inside folder)
  - collectionDirectCount: number (direct item length of folder)
  - itemSequenceThumbnails: Record<string, Record<string, SceneLaunchMediaItem>>
  - scrubSnapshot: any (scrub visual state details)
  - thumbnailSize: 'xs' | 'sm' | 'md' | 'lg' | 'xl'
  - reorderPreviewActive: boolean (active drag status)
  - brightness: number (relative brightness scale)
  - opacity: number (transparency percentage)
  - x: number
  - translateY: number
  - z: number
  - rotateY: number
  - scale: number
  - shouldRender: boolean (lazy rendering flag)
  - sizing: string ('uniform' | 'duration')
  - itemProgress: number (0 to 1 relative playing progress)
  - isItemProgressPlaying: boolean
  - progressTimelineTime: number
  - collectionDropTargetId: string | null (active highlight collection ID)

outputs:
  - onTileClick: callback when clicking the tile button
  - onTransitionEnd: callback when CSS transition ends
  - renderSelectedItemOverlay: custom render overlay function
  - beginDurationResize: callback when resizing starting/ending boundaries
  - handleDurationResizeKey: callback for arrow key trim adjustments

dependencies:
  - React
  - Lucide React (Folder, Clapperboard)
  - UniformItemProgress

always:
  - Avoid rendering circular nested items with identical keys (prepend role context to child keys).
  - Hide and scale crop handles depending on active and duration-sizing modes.

never:
  - Mutate start/duration offsets locally inside the tile component.
