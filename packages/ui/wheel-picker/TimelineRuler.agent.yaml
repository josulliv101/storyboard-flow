component: TimelineRuler

category: editor

purpose: >
  Renders floating timestamp ticks (e.g. 1.0s, 2.0s) above individual timeline media cards. Calculates tick frequencies and transforms offsets based on parent 3D transitions.

inputs:
  - itemWidth: number (item container width)
  - itemStartTime: number (starting second offset)
  - itemDuration: number (duration width in seconds)
  - itemEndTime: number (ending second offset)
  - rulerTickStep: number (seconds step interval)
  - rulerTop: number (vertical offset position)
  - opacity: number (transparency transform)
  - effect: string (wheel visual presentation mode name)
  - x: number (horizontal offset transform)
  - z: number (z-depth layout transform)
  - rotateY: number (yaw rotation transform)
  - scale: number (relative layout scale)
  - distance: number (normalized offset distance from center)
  - isLastItem: boolean (adds end boundary ticks)

outputs: []

dependencies:
  - React

always:
  - Interpolate tick marker percentages exactly relative to current item duration and starting offsets.
  - Apply transform CSS properties to maintain perfect 3D depth alignment with parent wheel layout shapes.

never:
  - Trigger DOM layout calculations within ticks rendering.
