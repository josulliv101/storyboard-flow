name: usePreviewWheelLayout
description: A custom layout geometry hook that encapsulates all coordinate systems math, timeline durations, item widths, grid layout wrapping offsets, sub-collection guides, and scroll limit calculations.
properties:
  items: Input array of timeline media items.
  disabledItemIds: Input array of disabled item IDs.
  itemSequences: Timeline sequences for nesting items.
  selectedMediaId: ID of the currently centered/selected item.
  selectedItemDurationSeconds: Custom duration of the selected item if active.
  sizing: Sizing modes ('uniform' | 'duration').
  durationScale: Zoom factor scaling duration-proportional tracks.
  effect: Flat or 3D view cylinder effects.
  hidePreview: Flag to hide player frames.
  gridItemGap: Horizontal gap between grid tiles.
  galleryItemHeight: Flat gallery view height index.
  viewportSize: Parent boundary width and height dimensions.
  gridView: Flag representing whether grid mode is active.
  customChunks: Optional grouped array representations of sub-sections.
  reorderPreviewOrder: Drag-and-drop order of active items.
  offset: Current timeline scroll pixel offset.
  playheadOffsetFromCenter: Horizontal distance of playhead relative to center of component.
  centerX: Midpoint coordinate of the component width.
  nestingLevel: Sub-folder directory level depths.
  gridNestingLevels: Depth array of all rows in the grid structure.
  rowIndex: Row index inside the list.
outputs:
  itemDurations: Array of calculated duration seconds per item.
  itemWidths: Layout width values per item track.
  itemStartTimes: Starting timeline times per item.
  totalDurationSeconds: Aggregated duration sum.
  rulerTickStep: Interval spacing between ruler ticks.
  itemCenterPositions: Center coordinates for all items in 3D space.
  itemStartPixels: Starting horizontal pixel borders per item.
  maxOffset: Right scroll boundary limit.
  minOffset: Left scroll boundary limit.
  resolveItemSnapshot: Method resolving exact playback timeline frame coordinates.
  getCollectionDirectCount: Method retrieving collection children counts.
  getCollectionMediaItems: Method retrieving collection sub-elements.
