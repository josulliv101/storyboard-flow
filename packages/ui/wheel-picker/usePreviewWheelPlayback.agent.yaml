name: usePreviewWheelPlayback
type: hook
description: A React custom hook managing playhead timeline ticking, playhead dragging, and scrubbing states for SceneLaunchPreviewWheelV3.
inputs:
  isPreviewPlaying:
    type: boolean
    description: Whether preview playback is actively playing.
  loopPreviewPlayback:
    type: boolean
    description: Whether to loop preview playback when it reaches the end.
  totalDurationSeconds:
    type: number
    description: Total duration of all media items.
  itemDurations:
    type: number[]
    description: Durations of all items in seconds.
  itemStartTimes:
    type: number[]
    description: Starting times in seconds of each media item.
  items:
    type: SceneLaunchMediaItem[]
    description: List of items.
  sizing:
    type: SceneLaunchPreviewWheelV3Sizing
    description: Sizing mode (uniform vs duration).
  isGallery:
    type: boolean
    description: Whether effect is gallery.
  timelineOriginOffset:
    type: number
    description: Center pixel origin offset.
  itemStartPixels:
    type: number[]
    description: Start pixel coordinate of each item.
  itemCenterPositions:
    type: number[]
    description: Center pixel coordinates of each item.
  finalIndex:
    type: number
    description: Final item index.
  selectedMediaId:
    type: string
    description: Selected media item ID.
  onPreviewPlaybackComplete:
    type: function
    description: Callback when playback reaches the end.
  onPlaybackMediaChange:
    type: function
    description: Callback when active playing media changes.
  onPlaybackTimeUpdate:
    type: function
    description: Callback when active playing time updates.
  setOffset:
    type: function
    description: Offset setter callback.
  resolveItemSnapshot:
    type: function
    description: Callback to resolve timeline elapsed seconds to item keyframe.
outputs:
  playbackSnapshotTime:
    type: number | null
    description: Time value of the snapshot to seek canvas previews to.
  isPlayheadDragging:
    type: boolean
    description: Whether the playhead is currently being dragged.
  beginPlayheadDrag:
    type: function
    description: Pointer down capture on playhead handle.
  movePlayheadDrag:
    type: function
    description: Pointer move on playhead handle.
  endPlayheadDrag:
    type: function
    description: Pointer up on playhead handle.
