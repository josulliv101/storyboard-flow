name: PreviewWheelPlayhead
description: Renders the timeline playhead line (static/playing indicator), the drag handle, arrow key navigation handlers, and navigation back buttons.
properties:
  renderedPlayheadX: The absolute horizontal pixel coordinate where the playhead is rendered.
  itemHeight: Height of the timeline items, matching the vertical line scale.
  itemTop: Top position offset of the timeline items.
  rulerPlayheadTimeSeconds: Elapsed playback time under the playhead.
  isPlayheadDragging: Boolean state flag representing whether the user is scrubbing/dragging the playhead.
  beginPlayheadDrag: Callback triggering the start of the playhead dragging pointer capture.
  movePlayheadDrag: Callback tracking pointer movements for scrubbing.
  endPlayheadDrag: Callback finalizing playhead scrubbing and release pointer capture.
  handlePlayheadKeyDown: Callback processing keyboard inputs for playhead fine scrubbing adjustments.
  onNavigateBack: Optional callback for returning back to a parent collection.
  canNavigateBack: Boolean flag denoting if the timeline supports folder nesting back navigation.
  isFirstGridRow: Boolean flag specifying if it is the first row inside the grid.
  parentCollectionName: Optional descriptive name of the parent folder.
  parentCollectionThumbnailUrl: Optional visual asset URL representing the parent folder thumbnail.
  shouldShowPlayhead: Flag determining if the playhead should be rendered.
  isSharedPlayheadPlaying: Flag indicating if the timeline is in playback state (which hides the handle).
  sizing: Sizing mode ('uniform' | 'duration').
  isGallery: Flag indicating if the timeline represents flat gallery grid mode.
