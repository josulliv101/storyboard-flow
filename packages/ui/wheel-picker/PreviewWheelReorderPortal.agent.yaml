name: PreviewWheelReorderPortal
description: Portal-rendered overlay containing the active reorder/drag utility target areas (Disable, Trash, Directory, Parent) and the floating ghost preview of the dragged item.
properties:
  reorderPreview: Metadata describing the current drag coordinate positions, dimensions, and active targets.
  items: Array of media items in the timeline.
  collectionItemIds: Array of folder/collection identifiers.
  disabledItemIds: Array of disabled media identifiers.
  utilityDropTarget: The active utility target being hovered over by the cursor (e.g. 'trash' | 'disable').
  collectionMultiCircleEnabled: Option to render multiple circles within nested folder thumbnails.
  getCollectionMediaItems: Callback to query children items inside a collection.
  getCollectionDirectCount: Callback to query direct sub-item count.
  scrubSnapshot: Current playback/scrub preview snapshot.
  itemSequenceThumbnails: Nested video/image frame maps.
  thumbnailSize: Layout thumbnail sizes ('xs' | 'sm' | 'md' | 'lg' | 'xl').
  reorderGhostRef: Reference pointer applied to the ghost wrapper container.
  reorderGhostContentRef: Reference pointer applied to the ghost visual child frame.
